      Aliya是理科生的理想型!玩家并非扮演游戏角色，而是真实的参与到游戏中，而且游戏时间与现实时间同步，所以会给人有一种很强的沉浸感，这是前所未有的。同时，也有很多细节，比如说心率，不同的情况下Aliya心率都会变化，将程序挂后台Aliya给你发信息你的Windows还会弹窗推送给你，仿佛这真的是一个活生生的人一样。
