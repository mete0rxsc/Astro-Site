    link: https://www.xscnet.cn/posts/p8pm120250329/
    cover: https://img.xscnet.cn//i/2026/06/27/6a3f88841dc57.png
    date: '2025-03-29T00:00:00.000Z'
    updated: '2025-03-29T00:00:00.000Z'
    excerpt: |-
      ::: zh-CN

      《茧》

      信纸在季风里打滑时  
      蝉声正在缝合  
      年轮的褶皱  

      我等你舌尖的盐  
      在暮色结晶  
      等二十四封信  
      被潮声蛀空  
      月光正拆解  
      每一粒沙的堤岸  

      黄昏在指缝崩塌七次之后  
      我们的名字  
      仍卡在春天的喉间  
      发不出芽  

      :::

      ::: en

