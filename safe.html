<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="robots" content="noindex,nofollow" />
	<title>安全跳转 | Mete0r's Blog</title>
	<link rel="icon" href="https://img.xscnet.cn//i/2026/04/15/69df23fa386ef.png" />
	<link rel="apple-touch-icon" href="https://img.xscnet.cn//i/2026/04/15/69df23fa386ef.png" />
	<style>
		:root {
			color-scheme: light;
			--bg: #edf5f1;
			--bg-soft: rgba(255, 255, 255, 0.66);
			--bg-strong: rgba(255, 255, 255, 0.9);
			--text: #1c2521;
			--muted: #64756d;
			--line: rgba(55, 74, 65, 0.16);
			--accent: #24977a;
			--accent-strong: #12806e;
			--accent-soft: rgba(36, 151, 122, 0.16);
			--rose: #69bfe9;
			--danger: #ba3434;
			--shadow: 0 28px 90px rgba(45, 72, 60, 0.22);
			--green-bg-image: url("https://img.xscnet.cn//i/2026/06/27/6a3f88841dc57.png");
			--pink-bg-image: url("https://img.xscnet.cn//i/2026/06/28/6a40fd6561a59.png");
		}

		:root[data-palette="pink"] {
			--bg: #fff1f6;
			--bg-soft: rgba(255, 255, 255, 0.7);
			--bg-strong: rgba(255, 251, 253, 0.92);
			--text: #2b1c24;
			--muted: #876779;
			--line: rgba(119, 54, 85, 0.18);
			--accent: #e86f9d;
			--accent-strong: #bb3f74;
			--accent-soft: rgba(232, 111, 157, 0.18);
			--rose: #8f76d8;
			--danger: #b83b55;
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg: #101815;
			--bg-soft: rgba(23, 34, 30, 0.72);
			--bg-strong: rgba(18, 29, 25, 0.92);
			--text: #edf7f2;
			--muted: #a4b7ae;
			--line: rgba(222, 246, 235, 0.16);
			--accent: #63d0b0;
			--accent-strong: #9feee1;
			--accent-soft: rgba(99, 208, 176, 0.18);
			--rose: #86cdf7;
			--danger: #ff7d88;
			--shadow: 0 28px 90px rgba(0, 0, 0, 0.36);
		}

		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--text);
			font-family: "Noto Sans SC", system-ui, sans-serif;
			background:
				linear-gradient(rgba(237, 245, 241, 0.76), rgba(237, 245, 241, 0.88)),
				var(--green-bg-image) center / cover fixed;
			overflow: hidden;
		}

		:root[data-palette="pink"] body {
			background:
				linear-gradient(rgba(255, 241, 246, 0.74), rgba(255, 241, 246, 0.9)),
				var(--pink-bg-image) center / cover fixed;
		}

		:root[data-theme="dark"] body {
			background:
				linear-gradient(rgba(10, 17, 14, 0.82), rgba(10, 17, 14, 0.92)),
				var(--green-bg-image) center / cover fixed;
		}

		:root[data-theme="dark"][data-palette="pink"] body {
			background:
				linear-gradient(rgba(27, 17, 23, 0.8), rgba(27, 17, 23, 0.92)),
				var(--pink-bg-image) center / cover fixed;
		}

		.safe-page {
			position: relative;
			display: grid;
			min-height: 100vh;
			place-items: center;
			padding: 28px;
		}

		.safe-page::before,
		.safe-page::after {
			content: "";
			position: fixed;
			border-radius: 50%;
			background: radial-gradient(circle, var(--accent-soft), transparent 68%);
			filter: blur(2px);
			animation: safe-orbit 12s ease-in-out infinite;
		}

		.safe-page::before {
			left: 8vw;
			top: 18vh;
			width: 260px;
			height: 260px;
		}

		.safe-page::after {
			right: 7vw;
			bottom: 13vh;
			width: 340px;
			height: 340px;
			animation-delay: -5s;
		}

		.safe-shell {
			position: relative;
			z-index: 1;
			width: min(680px, 100%);
			display: grid;
			justify-items: center;
			gap: 22px;
			animation: safe-enter 720ms cubic-bezier(0.2, 0.9, 0.2, 1) both;
		}

		.safe-orb {
			position: relative;
			display: grid;
			width: 104px;
			height: 104px;
			place-items: center;
			border: 1px solid var(--line);
			border-radius: 50%;
			background: var(--bg-strong);
			box-shadow: var(--shadow);
			animation: safe-pulse 2.4s ease-in-out infinite;
		}

		.safe-orb::before,
		.safe-orb::after {
			content: "";
			position: absolute;
			inset: -10px;
			border: 1px solid color-mix(in srgb, var(--accent), transparent 40%);
			border-radius: inherit;
			opacity: 0.7;
			animation: safe-ring 2.2s ease-out infinite;
		}

		.safe-orb::after {
			animation-delay: 1.1s;
		}

		.safe-orb svg {
			position: relative;
			z-index: 1;
			width: 62px;
			height: 62px;
			color: var(--muted);
			animation: safe-spin 5s linear infinite;
		}

		.safe-title {
			display: grid;
			justify-items: center;
			gap: 2px;
		}

		.safe-title h1 {
			margin: 0;
			font-size: clamp(1.7rem, 6vw, 2.4rem);
			line-height: 1.1;
		}

		.safe-title p {
			margin: 0;
			color: var(--muted);
			font-weight: 900;
		}

		.safe-card {
			position: relative;
			width: 100%;
			overflow: hidden;
			padding: 30px;
			border: 1px solid var(--line);
			border-radius: 24px;
			background: color-mix(in srgb, var(--bg-soft), transparent 4%);
			backdrop-filter: blur(22px);
			box-shadow: var(--shadow);
			display: grid;
			gap: 20px;
		}

		.safe-card::before {
			content: "";
			position: absolute;
			inset: 0;
			background: linear-gradient(110deg, transparent 12%, rgba(255, 255, 255, 0.24), transparent 42%);
			transform: translateX(-120%);
			animation: safe-shimmer 4s ease-in-out infinite;
			pointer-events: none;
		}

		.safe-card h2 {
			position: relative;
			margin: 0;
			text-align: center;
			font-size: 1rem;
		}

		.safe-url {
			position: relative;
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 8px;
			align-items: center;
			padding: 9px;
			border: 1px solid color-mix(in srgb, var(--line), var(--accent) 24%);
			border-radius: 18px;
			background: color-mix(in srgb, var(--bg-strong), transparent 10%);
			transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
		}

		.safe-url.is-copied {
			border-color: var(--accent);
			box-shadow: 0 0 0 5px var(--accent-soft), 0 16px 44px rgba(36, 151, 122, 0.18);
			transform: translateY(-2px);
			animation: safe-bump 420ms cubic-bezier(0.2, 0.9, 0.2, 1);
		}

		.safe-url code {
			overflow: hidden;
			padding: 0 8px;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-size: clamp(0.92rem, 3vw, 1.18rem);
			font-weight: 900;
		}

		.safe-copy {
			position: relative;
			display: grid;
			place-items: center;
			width: 42px;
			height: 42px;
			overflow: hidden;
			border: 1px solid var(--line);
			border-radius: 14px;
			color: var(--accent-strong);
			background: var(--bg-soft);
			cursor: pointer;
			font-weight: 900;
			transition: transform 180ms ease, color 180ms ease, background 180ms ease;
		}

		.safe-copy svg {
			position: relative;
			z-index: 1;
			width: 18px;
			height: 18px;
			fill: currentColor;
			transition: transform 180ms ease;
		}

		.safe-copy.is-copied svg {
			transform: rotate(-8deg) scale(1.14);
		}

		.safe-copy::after {
			content: "";
			position: absolute;
			left: var(--ripple-x, 50%);
			top: var(--ripple-y, 50%);
			width: 10px;
			height: 10px;
			border-radius: 50%;
			background: var(--accent);
			opacity: 0;
			transform: translate(-50%, -50%) scale(1);
			pointer-events: none;
		}

		.safe-copy.is-copied {
			color: white;
			background: linear-gradient(135deg, var(--accent), var(--rose));
			transform: rotate(-4deg) scale(1.08);
		}

		.safe-copy.is-copied::after {
			animation: copy-ripple 620ms ease-out;
		}

		.copy-toast {
			position: fixed;
			top: 22px;
			left: 50%;
			z-index: 20;
			padding: 12px 16px;
			border: 1px solid var(--line);
			border-radius: 999px;
			color: var(--accent-strong);
			background: var(--bg-strong);
			box-shadow: var(--shadow);
			font-size: 0.92rem;
			font-weight: 900;
			opacity: 0;
			pointer-events: none;
			transform: translate(-50%, -18px) scale(0.96);
			transition: opacity 180ms ease, transform 220ms cubic-bezier(0.2, 0.9, 0.2, 1);
		}

		.copy-toast.is-visible {
			opacity: 1;
			transform: translate(-50%, 0) scale(1);
		}

		.copy-spark {
			position: fixed;
			z-index: 19;
			width: 8px;
			height: 8px;
			border-radius: 50%;
			background: var(--accent);
			pointer-events: none;
			animation: copy-spark 720ms ease-out forwards;
		}

		.safe-note {
			position: relative;
			margin: 0;
			color: var(--muted);
			text-align: center;
			font-size: 0.9rem;
			font-weight: 900;
		}

		.safe-progress {
			position: relative;
			height: 10px;
			overflow: hidden;
			border-radius: 999px;
			background: color-mix(in srgb, var(--line), transparent 26%);
		}

		.safe-progress span {
			display: block;
			width: 100%;
			height: 100%;
			border-radius: inherit;
			background: linear-gradient(90deg, var(--accent), var(--rose));
			transform-origin: left center;
			animation: safe-countdown 10s linear forwards;
		}

		.safe-actions {
			position: relative;
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 18px;
		}

		.safe-actions a,
		.safe-actions button {
			min-height: 48px;
			border: 0;
			border-radius: 18px;
			color: white;
			font: inherit;
			font-weight: 900;
			text-decoration: none;
			display: grid;
			place-items: center;
			cursor: pointer;
			transition: transform 180ms ease, filter 180ms ease;
		}

		.safe-actions a:hover,
		.safe-actions button:hover {
			transform: translateY(-3px);
			filter: brightness(1.06);
		}

		.safe-cancel {
			background: linear-gradient(135deg, var(--danger), color-mix(in srgb, var(--danger), #111 18%));
		}

		.safe-go {
			background: linear-gradient(135deg, var(--accent), var(--rose));
		}

		.safe-error { color: var(--danger); }

		@keyframes safe-enter {
			from {
				opacity: 0;
				transform: translateY(18px) scale(0.96);
				filter: blur(10px);
			}
			to {
				opacity: 1;
				transform: translateY(0) scale(1);
				filter: blur(0);
			}
		}

		@keyframes safe-spin { to { transform: rotate(360deg); } }
		@keyframes safe-pulse { 50% { transform: translateY(-6px) scale(1.035); } }
		@keyframes safe-orbit { 50% { transform: translate3d(36px, -28px, 0) scale(1.12); } }
		@keyframes safe-countdown { to { transform: scaleX(0); } }
		@keyframes safe-shimmer {
			45%, 100% { transform: translateX(120%); }
		}
		@keyframes safe-ring {
			to {
				opacity: 0;
				transform: scale(1.35);
			}
		}
		@keyframes safe-bump {
			45% { transform: translateY(-2px) scale(1.015); }
		}
		@keyframes copy-ripple {
			0% { opacity: 0.34; transform: translate(-50%, -50%) scale(1); }
			100% { opacity: 0; transform: translate(-50%, -50%) scale(18); }
		}
		@keyframes copy-spark {
			to {
				opacity: 0;
				transform: translate(var(--dx), var(--dy)) scale(0.2);
			}
		}

		@media (max-width: 620px) {
			.safe-page { padding: 18px; }
			.safe-card {
				padding: 20px;
				border-radius: 18px;
			}
			.safe-actions { grid-template-columns: 1fr; }
		}
	</style>
	<script>
		const savedTheme = localStorage.getItem("theme");
		const savedPalette = localStorage.getItem("palette");
		const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
		document.documentElement.dataset.theme = savedTheme || (prefersDark ? "dark" : "light");
		document.documentElement.dataset.palette = savedPalette || "green";
	</script>
</head>
<body>
	<div class="copy-toast" data-copy-toast>链接已复制到剪贴板</div>
	<main class="safe-page">
		<section class="safe-shell">
			<div class="safe-orb" aria-hidden="true">
				<svg viewBox="0 0 64 64" fill="none">
					<circle cx="32" cy="32" r="21" stroke="currentColor" stroke-width="3" opacity="0.35"></circle>
					<path d="M13 36c10-18 28-25 38-19-6 4-9 12-8 23-9 3-22 2-30-4Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"></path>
					<path d="M8 56 56 8" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity="0.42"></path>
				</svg>
			</div>
			<div class="safe-title">
				<h1>即将离开本站</h1>
				<p>安全跳转确认</p>
			</div>
			<div class="safe-card">
				<h2>您即将跳转到以下外部链接</h2>
				<div class="safe-url" data-safe-url-box>
					<code data-safe-url>正在解析目标地址...</code>
					<button class="safe-copy" type="button" data-copy-url aria-label="复制目标地址" title="复制目标地址">
						<svg viewBox="0 0 16 16" aria-hidden="true">
							<path fill-rule="evenodd" d="M5.75 1a.75.75 0 0 0-.75.75v3c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-3A.75.75 0 0 0 10.25 1zm.75 3V2.5h3V4zm-2.874-.467a.75.75 0 0 0-.752-1.298A1.75 1.75 0 0 0 2 3.75v9.5C2 14.216 2.784 15 3.75 15h8.5A1.75 1.75 0 0 0 14 13.25v-9.5c0-.648-.353-1.214-.874-1.515a.75.75 0 1 0-.752 1.298.25.25 0 0 1 .126.217v9.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25v-9.5a.25.25 0 0 1 .126-.217"/>
						</svg>
					</button>
				</div>
				<p class="safe-note" data-safe-note>将在 <strong data-countdown>10</strong> 秒后跳转，请自行确认链接安全性</p>
				<div class="safe-progress" aria-hidden="true"><span></span></div>
				<div class="safe-actions">
					<button class="safe-cancel" type="button" data-cancel-jump>取消跳转</button>
					<button class="safe-go" type="button" data-go-now>立即跳转</button>
				</div>
			</div>
		</section>
	</main>
	<script>
		const decodeBase64Url = (value) => {
			const normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
			const padded = normalized.padEnd(Math.ceil(normalized.length / 4) * 4, "=");
			return new TextDecoder().decode(Uint8Array.from(atob(padded), (char) => char.charCodeAt(0)));
		};

		const params = new URLSearchParams(window.location.search);
		const raw = params.get("Base64Url");
		const urlNode = document.querySelector("[data-safe-url]");
		const urlBox = document.querySelector("[data-safe-url-box]");
		const countdownNode = document.querySelector("[data-countdown]");
		const noteNode = document.querySelector("[data-safe-note]");
		const goButton = document.querySelector("[data-go-now]");
		const cancelButton = document.querySelector("[data-cancel-jump]");
		const copyButton = document.querySelector("[data-copy-url]");
		const copyToast = document.querySelector("[data-copy-toast]");
		let timer = null;
		let toastTimer = null;
		let target = "";

		try {
			target = decodeBase64Url(raw);
			const parsed = new URL(target);
			if (!["http:", "https:"].includes(parsed.protocol)) throw new Error("invalid protocol");
			urlNode.textContent = parsed.href;
		} catch (error) {
			noteNode.classList.add("safe-error");
			noteNode.textContent = "目标链接解析失败，已停止跳转。";
			goButton.disabled = true;
		}

		const jump = () => {
			if (target) window.location.href = target;
		};

		const showCopyFeedback = (event) => {
			const rect = copyButton.getBoundingClientRect();
			copyButton.style.setProperty("--ripple-x", `${event.clientX - rect.left}px`);
			copyButton.style.setProperty("--ripple-y", `${event.clientY - rect.top}px`);
			copyButton.classList.remove("is-copied");
			urlBox.classList.remove("is-copied");
			void copyButton.offsetWidth;
			copyButton.classList.add("is-copied");
			urlBox.classList.add("is-copied");
			copyButton.setAttribute("aria-label", "已复制");
			copyButton.setAttribute("title", "已复制");
			copyToast.classList.add("is-visible");

			for (let index = 0; index < 12; index += 1) {
				const spark = document.createElement("span");
				const angle = (Math.PI * 2 * index) / 12;
				const distance = 34 + Math.random() * 28;
				spark.className = "copy-spark";
				spark.style.left = `${event.clientX}px`;
				spark.style.top = `${event.clientY}px`;
				spark.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
				spark.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
				document.body.appendChild(spark);
				window.setTimeout(() => spark.remove(), 760);
			}

			window.clearTimeout(toastTimer);
			toastTimer = window.setTimeout(() => {
				copyButton.classList.remove("is-copied");
				urlBox.classList.remove("is-copied");
				copyButton.setAttribute("aria-label", "复制目标地址");
				copyButton.setAttribute("title", "复制目标地址");
				copyToast.classList.remove("is-visible");
			}, 1300);
		};

		if (target) {
			let remaining = 10;
			timer = window.setInterval(() => {
				remaining -= 1;
				countdownNode.textContent = String(Math.max(remaining, 0));
				if (remaining <= 0) {
					window.clearInterval(timer);
					jump();
				}
			}, 1000);
		}

		goButton.addEventListener("click", jump);
		cancelButton.addEventListener("click", () => {
			if (timer) window.clearInterval(timer);
			window.close();
			window.setTimeout(() => {
				if (!window.closed) {
					noteNode.textContent = "浏览器阻止了自动关闭标签页，请手动关闭当前安全跳转页面。";
					noteNode.classList.add("safe-error");
				}
			}, 250);
		});
		copyButton.addEventListener("click", async (event) => {
			if (!target) return;
			await navigator.clipboard?.writeText(target).catch(() => {});
			showCopyFeedback(event);
		});
	</script>
</body>
</html>
